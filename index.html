<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Geral - Cálculo de Rendimento CDI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    label {
      display: block;
      margin: 15px 0 5px;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background-color: #2980b9;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #3498db;
    }
    .resultado {
      margin-top: 20px;
      padding: 10px;
      background-color: #ecf0f1;
      border-left: 5px solid #2980b9;
    }
    table {
      margin-top: 15px;
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #2980b9;
      color: white;
    }
    #grafico-container {
      margin-top: 40px;
    }
    #exportarPDF {
      background-color: #27ae60;
    }
    #exportarPDF:hover {
      background-color: #2ecc71;
    }
  </style>
</head>
<body>
  <h1>Update Geral</h1>
  <p>Calculadora de Rendimento de Investimento atrelado ao CDI</p>

  <label for="valor">Valor investido (R$):</label>
  <input type="number" id="valor" placeholder="Ex: 10000">

  <label for="cdi">Taxa CDI anual (%):</label>
  <input type="number" id="cdi" step="0.01" placeholder="Ex: 10.65">

  <label for="percentual">Percentual do CDI (%):</label>
  <input type="number" id="percentual" placeholder="Ex: 110">

  <label for="dias">Prazo (em dias úteis):</label>
  <input type="number" id="dias" placeholder="Ex: 180">

  <button onclick="calcularRendimento()">Calcular</button>
  <button id="exportarPDF" onclick="exportarPDF()">Exportar Resultado em PDF</button>

  <div class="resultado" id="resultado"></div>

  <div id="grafico-container">
    <canvas id="graficoRendimento" width="400" height="200"></canvas>
  </div>

  <script>
    let grafico;

    function calcularRendimento() {
      const valor = parseFloat(document.getElementById('valor').value);
      const cdiAnual = parseFloat(document.getElementById('cdi').value);
      const percentualCDI = parseFloat(document.getElementById('percentual').value);
      const dias = parseInt(document.getElementById('dias').value);

      if (isNaN(valor) || isNaN(cdiAnual) || isNaN(percentualCDI) || isNaN(dias)) {
        document.getElementById('resultado').innerText = "Por favor, preencha todos os campos corretamente.";
        return;
      }

      const cdiEfetivo = (cdiAnual / 100) * (percentualCDI / 100);
      const rendimentoFinal = valor * Math.pow(1 + (cdiEfetivo / 252), dias);
      const lucroBruto = rendimentoFinal - valor;

      let aliquota;
      let faixa;
      if (dias <= 180) {
        aliquota = 0.225;
        faixa = "Até 180 dias";
      } else if (dias <= 360) {
        aliquota = 0.20;
        faixa = "De 181 a 360 dias";
      } else if (dias <= 720) {
        aliquota = 0.175;
        faixa = "De 361 a 720 dias";
      } else {
        aliquota = 0.15;
        faixa = "Acima de 720 dias";
      }

      const imposto = lucroBruto * aliquota;
      const lucroLiquido = lucroBruto - imposto;

      const tabelaHTML = `
        <strong>Resultado:</strong>
        <table id="tabelaResultado">
          <tr><th>Descrição</th><th>Valor</th></tr>
          <tr><td>Valor final</td><td>R$ ${rendimentoFinal.toFixed(2)}</td></tr>
          <tr><td>Lucro bruto</td><td>R$ ${lucroBruto.toFixed(2)}</td></tr>
          <tr><td>Faixa de IR</td><td>${faixa}</td></tr>
          <tr><td>Alíquota de IR</td><td>${(aliquota * 100).toFixed(1)}%</td></tr>
          <tr><td>Valor do IR</td><td>R$ ${imposto.toFixed(2)}</td></tr>
          <tr><th>Lucro líquido</th><th>R$ ${lucroLiquido.toFixed(2)}</th></tr>
        </table>
      `;

      document.getElementById('resultado').innerHTML = tabelaHTML;

      let valores = [];
      let labels = [];
      for (let i = 0; i <= dias; i++) {
        const valorDia = valor * Math.pow(1 + (cdiEfetivo / 252), i);
        valores.push(valorDia.toFixed(2));
        labels.push(`Dia ${i}`);
      }

      if (grafico) grafico.destroy();

      const ctx = document.getElementById('graficoRendimento').getContext('2d');
      grafico = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Evolução do Investimento',
            data: valores,
            borderColor: '#2980b9',
            backgroundColor: 'rgba(41, 128, 185, 0.2)',
            tension: 0.2,
            fill: true,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              display: true
            }
          },
          scales: {
            y: {
              beginAtZero: false
            }
          }
        }
      });
    }

    async function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.text("Resultado do Investimento", 10, 10);

      const resultadoHTML = document.getElementById("tabelaResultado");
      if (resultadoHTML) {
        const tabelaTexto = resultadoHTML.innerText.split("\n");
        let y = 20;
        for (const linha of tabelaTexto) {
          doc.text(linha, 10, y);
          y += 7;
        }
      }

      const canvas = document.getElementById("graficoRendimento");
      const imgData = canvas.toDataURL("image/png");
      doc.addPage();
      doc.addImage(imgData, "PNG", 10, 20, 180, 100);

      doc.save("resultado-investimento.pdf");
    }
  </script>
</body>
</html>
