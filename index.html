<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Geral - Cálculo de Rendimento CDI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    label {
      display: block;
      margin: 15px 0 5px;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background-color: #2980b9;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #3498db;
    }
    .resultado {
      margin-top: 20px;
      padding: 10px;
      background-color: #ecf0f1;
      border-left: 5px solid #2980b9;
    }
    table {
      margin-top: 15px;
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #2980b9;
      color: white;
    }
    #grafico-container {
      margin-top: 40px;
    }
    #exportarPDF {
      background-color: #27ae60;
    }
    #exportarPDF:hover {
      background-color: #2ecc71;
    }
    .info-economica {
      margin: 20px 0;
      padding: 10px;
      background-color: #fff;
      border: 1px solid #ccc;
    }
    .info-economica h2 {
      margin-top: 0;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <h1>Update Geral</h1>
  <p>Calculadora de Rendimento de Investimento atrelado ao CDI</p>

  <div class="info-economica" id="infoEconomica">
    <h2>Informações Econômicas</h2>
    <p><strong>Taxa Selic atual:</strong> <span id="selic">Carregando...</span></p>
    <p><strong>Dólar hoje:</strong> <span id="dolar">Carregando...</span></p>
    <p><strong>Euro hoje:</strong> <span id="euro">Carregando...</span></p>
  </div>

  <label for="valor">Valor investido (R$):</label>
  <input type="number" id="valor" placeholder="Ex: 10000">

  <label for="cdi">Taxa CDI anual (%):</label>
  <input type="number" id="cdi" step="0.01" placeholder="Ex: 10.65">

  <label for="percentual">Percentual do CDI (%):</label>
  <input type="number" id="percentual" placeholder="Ex: 110">

  <label for="dias">Prazo (em dias úteis):</label>
  <input type="number" id="dias" placeholder="Ex: 180">

  <button onclick="calcularRendimento()">Calcular</button>
  <button id="exportarPDF" onclick="exportarPDF()">Exportar Resultado em PDF</button>

  <div class="resultado" id="resultado"></div>

  <div id="grafico-container">
    <canvas id="graficoRendimento" width="400" height="200"></canvas>
  </div>

  <script>
    let grafico;

    async function carregarInformacoesEconomicas() {
      try {
        const selicResponse = await fetch("https://api.bcb.gov.br/dados/serie/bcdata.sgs.4189/dados/ultimos/1?formato=json");
        const selicData = await selicResponse.json();
        document.getElementById("selic").innerText = parseFloat(selicData[0].valor).toFixed(2) + "% a.a.";

        const moedasResponse = await fetch("https://economia.awesomeapi.com.br/last/USD-BRL,EUR-BRL");
        const moedasData = await moedasResponse.json();
        document.getElementById("dolar").innerText = "R$ " + parseFloat(moedasData.USDBRL.bid).toFixed(2);
        document.getElementById("euro").innerText = "R$ " + parseFloat(moedasData.EURBRL.bid).toFixed(2);
      } catch (error) {
        console.error("Erro ao carregar informações econômicas", error);
        document.getElementById("selic").innerText = "Erro ao carregar";
        document.getElementById("dolar").innerText = "Erro ao carregar";
        document.getElementById("euro").innerText = "Erro ao carregar";
      }
    }

    function calcularIR(lucro, dias) {
      let aliquota;
      if (dias <= 180) aliquota = 22.5;
      else if (dias <= 360) aliquota = 20;
      else if (dias <= 720) aliquota = 17.5;
      else aliquota = 15;
      return {
        imposto: lucro * (aliquota / 100),
        aliquota
      };
    }

    function calcularRendimento() {
      const valor = parseFloat(document.getElementById("valor").value);
      const cdi = parseFloat(document.getElementById("cdi").value);
      const percentual = parseFloat(document.getElementById("percentual").value);
      const dias = parseInt(document.getElementById("dias").value);

      if (isNaN(valor) || isNaN(cdi) || isNaN(percentual) || isNaN(dias)) {
        alert("Preencha todos os campos corretamente.");
        return;
      }

      const rendimentoBruto = valor * Math.pow(1 + ((cdi / 100) * (percentual / 100)) / 252, dias) - valor;
      const { imposto, aliquota } = calcularIR(rendimentoBruto, dias);
      const rendimentoLiquido = rendimentoBruto - imposto;

      const html = `
        <table>
          <tr><th>Valor Investido</th><td>R$ ${valor.toFixed(2)}</td></tr>
          <tr><th>Rendimento Bruto</th><td>R$ ${rendimentoBruto.toFixed(2)}</td></tr>
          <tr><th>Alíquota IR</th><td>${aliquota}%</td></tr>
          <tr><th>IR sobre lucro</th><td>R$ ${imposto.toFixed(2)}</td></tr>
          <tr><th>Lucro Líquido</th><td><strong>R$ ${rendimentoLiquido.toFixed(2)}</strong></td></tr>
        </table>
      `;

      document.getElementById("resultado").innerHTML = html;

      const ctx = document.getElementById("graficoRendimento").getContext("2d");
      if (grafico) grafico.destroy();
      grafico = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Investido", "Lucro Líquido"],
          datasets: [{
            label: "Valores (R$)",
            data: [valor, rendimentoLiquido],
            backgroundColor: ["#3498db", "#2ecc71"]
          }]
        }
      });
    }

    function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("Relatório de Rendimento", 10, 10);
      doc.fromHTML(document.getElementById("resultado"), 10, 20);
      doc.save("relatorio-rendimento.pdf");
    }

    carregarInformacoesEconomicas();
  </script>
</body>
</html>
